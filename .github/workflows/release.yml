name: Release

# INFO: Publishes a GitHub Release for the version in module/module.prop, with that
#         version's section of CHANGELOG.md as notes. Either:
#         - Actions > Release > Run workflow (on main): creates the tag itself, or
#         - push a tag that matches the version (git tag v0.0.4 && git push origin v0.0.4).
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Test build: tag it <version>-test.<run>, mark it as a pre-release and leave update.json alone"
        type: boolean
        default: false
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check version
        run: |
          prop=$(sed -n 's/^version=//p' module/module.prop)
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$prop" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match module.prop version $prop" >&2
            exit 1
          fi
          # INFO: A test build gets its own tag, so it never clashes with the real release.
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            echo "TAG=$prop-test.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
            echo "PRE=true" >> "$GITHUB_ENV"
          else
            echo "TAG=$prop" >> "$GITHUB_ENV"
            echo "PRE=false" >> "$GITHUB_ENV"
          fi
          echo "VERSION=$prop" >> "$GITHUB_ENV"
          echo "CODE=$(sed -n 's/^versionCode=//p' module/module.prop)" >> "$GITHUB_ENV"

      - name: Package
        run: |
          mkdir -p out
          (cd module && zip -qr9 ../out/NextSUSFS.zip . -x '.*')
          cp out/NextSUSFS.zip "out/NextSUSFS-$TAG.zip"

      - name: Write release notes
        run: |
          {
            echo '> [!WARNING]'
            echo '> **Personal project, use at your own risk.** Keep a way to boot without modules (safe mode) before installing.'
            echo
            echo '## Changes'
            echo
            awk -v v="## $VERSION" '$0 == v {f = 1; next} /^## / {f = 0} f' CHANGELOG.md
            echo
            echo '## Install'
            echo
            echo 'Install `NextSUSFS.zip` from KernelSU (or a fork) → Modules → Install from storage, then reboot. Needs a SuSFS-patched kernel.'
          } > notes.md
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" out/NextSUSFS.zip "out/NextSUSFS-$TAG.zip" \
            --target "$GITHUB_SHA" --title "NextSUSFS $TAG$([ "$PRE" = true ] && echo ' (test)')" --notes-file notes.md \
            $([ "$PRE" = true ] && echo --prerelease)

      # INFO: Point update.json (module.prop: updateJson) at this release, so root managers
      #         offer it as an update.
      - name: Update update.json
        if: env.PRE != 'true'
        run: |
          git fetch origin main
          git checkout -B update-json origin/main
          cat > update.json <<EOF
          {
            "version": "${TAG}",
            "versionCode": ${CODE},
            "zipUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/NextSUSFS.zip",
            "changelog": "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/CHANGELOG.md"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "chore: update.json for ${TAG}" && git push origin HEAD:main || echo "update.json unchanged"

      # INFO: Releases created with GITHUB_TOKEN do not trigger other workflows, so
      #         telegram-notify.yml never sees them. Post to the channel from here.
      - name: Notify Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
          # Optional: the topic (message_thread_id) inside a group with topics.
          TELEGRAM_TOPIC: ${{ secrets.TELEGRAM_TOPIC }}
          TOOL: NextSUSFS
          ICON: "🛡️"
          LAYER: "طبقة الكيرنل · منظومة NEXT"
          REQUIRES: "KernelSU + كيرنل SuSFS v2"
          AUTO_UPDATE: "true"
          TAG: ${{ env.TAG }}
          VERSION: ${{ env.VERSION }}
          PRE: ${{ env.PRE }}
          FILE: out/NextSUSFS-${{ env.TAG }}.zip
        run: bash .github/scripts/telegram-release.sh