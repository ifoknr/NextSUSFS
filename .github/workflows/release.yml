name: Release

# INFO: Publishes a GitHub Release for the version in module/module.prop, with that
#         version's section of CHANGELOG.md as notes. Either:
#         - Actions > Release > Run workflow (on main): creates the tag itself, or
#         - push a tag that matches the version (git tag v0.0.4 && git push origin v0.0.4).
on:
  workflow_dispatch:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check version
        run: |
          prop=$(sed -n 's/^version=//p' module/module.prop)
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$prop" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match module.prop version $prop" >&2
            exit 1
          fi
          echo "TAG=$prop" >> "$GITHUB_ENV"

      - name: Package
        run: |
          mkdir -p out
          (cd module && zip -qr9 ../out/NextSUSFS.zip . -x '.*')
          cp out/NextSUSFS.zip "out/NextSUSFS-$TAG.zip"

      - name: Write release notes
        run: |
          {
            echo '> [!WARNING]'
            echo '> **Personal project, use at your own risk.** Keep a way to boot without modules (safe mode) before installing.'
            echo
            echo '## Changes'
            echo
            awk -v v="## $TAG" '$0 == v {f = 1; next} /^## / {f = 0} f' CHANGELOG.md
            echo
            echo '## Install'
            echo
            echo 'Install `NextSUSFS.zip` from KernelSU (or a fork) → Modules → Install from storage, then reboot. Needs a SuSFS-patched kernel.'
          } > notes.md
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" out/NextSUSFS.zip "out/NextSUSFS-$TAG.zip" \
            --target "$GITHUB_SHA" --title "NextSUSFS $TAG" --notes-file notes.md
